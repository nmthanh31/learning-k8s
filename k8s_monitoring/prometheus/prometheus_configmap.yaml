apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    alerting:
      alertmanagers:
      - static_configs:
        - targets:
          - alertmanager.monitoring.svc.cluster.local:9093

    rule_files:
      - /etc/prometheus/alert.rules.yml

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'node-exporter'
        static_configs:
          - targets:
            - 172.18.0.61:9100
            - 172.18.0.62:9100
            - 172.18.0.63:9100

      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics.monitoring.svc.cluster.local:8080']

      - job_name: 'cilium'
        static_configs:
          - targets: ['cilium-metrics.kube-system.svc.cluster.local:9962']

  alert.rules.yml: |
    groups:
      - name: example-alert
        rules:
          - alert: InstanceDown
            expr: up == 0
            for: 5s
            labels:
              severity: critical
            annotations:
              summary: "Instance {{ $labels.instance }} down"
              description: "Target {{ $labels.instance }} has been down for more than 1 minute"