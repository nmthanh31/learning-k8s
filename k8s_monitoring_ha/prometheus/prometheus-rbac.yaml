# 1. ServiceAccount: Định danh kỹ thuật cho Prometheus Pod
# Giúp Pod có định danh để gửi kèm khi gọi vào Kubernetes API Server.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
# 2. ClusterRole: Tập hợp các quyền hạn trên toàn hệ thống
# Prometheus cần quyền "đọc" (get, list, watch) để thực hiện Service Discovery.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
# Nhóm "" (Core API): Bao gồm các tài nguyên cơ bản nhất
- apiGroups: [""]
  resources:
  - nodes         # Để biết Cluster có bao nhiêu máy chủ vật lý
  - nodes/proxy   # Để truy cập metrics qua /proxy (cAdvisor)
  - nodes/metrics # Để lấy metrics trực tiếp từ Kubelet
  - services      # Để tìm các Service cần scrape dữ liệu
  - endpoints     # Để lấy danh sách IP thực tế của các Pod đằng sau Service
  - pods          # Để lấy metadata của Pod (nhãn, annotation)
  verbs: ["get", "list", "watch"]

# Nhóm "apps": Bao gồm Deployments, StatefulSets
- apiGroups: ["extensions", "apps"]
  resources:
  - deployments   # Để giám sát trạng thái triển khai ứng dụng
  verbs: ["get", "list", "watch"]

# Quyền đọc ConfigMaps
- apiGroups: [""]
  resources:
  - configmaps    # Đôi khi cần đọc metadata của config để reload
  verbs: ["get", "list", "watch"]

# Quyền truy cập các URL metrics không phải dạng Resource (như /metrics)
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]
---
# 3. ClusterRoleBinding: Trao quyền cho ServiceAccount
# Liên kết ClusterRole (quyền) trực tiếp với ServiceAccount (Pod).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus # Tên ClusterRole ở trên
subjects:
- kind: ServiceAccount
  name: prometheus # Tên ServiceAccount ở trên
  namespace: monitoring
