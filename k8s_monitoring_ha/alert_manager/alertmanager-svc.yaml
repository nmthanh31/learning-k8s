# Service ClusterIP: Tạo IP ảo làm đại diện duy nhất cho cụm Alertmanager.
# Prometheus sẽ gửi các cảnh báo (firing alerts) đến địa chỉ 'alertmanager:9093'.
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  selector:
    app: alertmanager   # Lọc các Pod có nhãn 'app: alertmanager' để dẫn traffic vào
  ports:
    - name: web
      port: 9093        # Port mà các service khác kết nối tới
      targetPort: 9093  # Port thực tế trên Container
      protocol: TCP