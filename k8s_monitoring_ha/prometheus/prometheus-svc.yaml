apiVersion: v1
kind: Service
metadata:
  name: prometheus-headless
  namespace: monitoring
  labels:
    app: prometheus
spec:
  clusterIP: None
  ports:
    - name: web
      port: 9090
      targetPort: 9090
  selector:
    app: prometheus
---
# Service ClusterIP cho Prometheus — truy cập nội bộ trong cluster
# Để truy cập từ bên ngoài, sử dụng: kubectl port-forward svc/prometheus 9090:9090 -n monitoring
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  ports:
    - port: 9090
      protocol: TCP
      targetPort: 9090
  selector:
    app: prometheus
  type: ClusterIP
