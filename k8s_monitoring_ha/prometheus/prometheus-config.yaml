# ConfigMap chứa cấu hình chính cho Prometheus và Alert Rules
apiVersion: v1
kind: ConfigMap
metadata: 
  name: prometheus-config
  namespace: monitoring # Namespace triển khai hệ thống giám sát
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s     # Tần suất lấy dữ liệu từ targets (mặc định 15s)
      evaluation_interval: 15s # Tần suất đánh giá các quy tắc cảnh báo (Alert Rules)

    alerting:
      alertmanagers:
      - static_configs:
        - targets:
          # Địa chỉ Service của Alertmanager để Prometheus gửi cảnh báo khi có lỗi
          - alertmanager.monitoring.svc.cluster.local:9093

    rule_files:
      # Đường dẫn nạp các file quy tắc cảnh báo vào Prometheus
      - /etc/prometheus/alert.rules.yml

    scrape_configs:
      # Job tự giám sát chính Prometheus
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Job giám sát tài nguyên phần cứng các Node (Node Exporter)
      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: endpoints # Sử dụng Service Discovery qua Endpoint Kubernetes
            namespaces:
              names:
                - monitoring

        relabel_configs:
          # Chỉ giữ lại các endpoint thuộc Service có tên 'node-exporter'
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: node-exporter

          # Chỉ lấy port có tên là 'metrics' HOẶC port số 9100 (đề phòng headless service không có tên port)
          - source_labels: [__meta_kubernetes_endpoint_port_name, __meta_kubernetes_pod_container_port_number]
            action: keep
            regex: (metrics;.*|.*;9100)

          # Chuyển nhãn tên Node của Pod thành nhãn 'node' để dễ dàng query
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node

          # Áp dụng tất cả các nhãn (labels) của Pod vào metric (bỏ tiền tố __meta_kubernetes_pod_label_)
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)

      # Job giám sát trạng thái các đối tượng trong Cluster (Deployment, Pod, StatefulSet...)
      - job_name: 'kube-state-metrics'
        static_configs: 
          - targets:
            - kube-state-metrics.monitoring.svc.cluster.local:8080

      # Job giám sát Cilium (Networking & Security)
      - job_name: cilium
        kubernetes_sd_configs:
          - role: pod # Duyệt trực tiếp qua danh sách Pod

        relabel_configs:
          # Chỉ lấy các Pod có nhãn k8s-app=cilium
          - source_labels: [__meta_kubernetes_pod_label_k8s_app]
            action: keep
            regex: cilium

          # Thay đổi địa chỉ metric thành IP của Pod và port 9962
          - source_labels: [__meta_kubernetes_pod_ip]
            separator: ;
            regex: (.*)
            target_label: __address__
            replacement: ${1}:9962
            action: replace

          # Gán nhãn node để biết Pod cilium này đang chạy trên host nào
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node

  # File định nghĩa các quy tắc để Prometheus kích hoạt cảnh báo
  alert.rules.yml: |
    groups:
      - name: node-alertsv
        rules:
          - alert: InstanceDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Dịch vụ {{ $labels.instance }} bị ngừng hoạt động"
              description: "Target {{ $labels.instance }} thuộc job {{ $labels.job }} đã mất kết nối trên 1 phút."

          - alert: HighCpuLoad
            expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "CPU trên server {{ $labels.instance }} đang quá tải"
              description: "Mức sử dụng CPU vượt ngưỡng 85% trong 5 phút qua."

          - alert: HighMemoryUsage
            expr: 100 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100) > 90
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "RAM trên server {{ $labels.instance }} gần cạn kiệt"
              description: "Mức sử dụng RAM vượt ngưỡng 90% trong 5 phút qua."

          - alert: HighDiskUsage
            expr: 100 - (node_filesystem_avail_bytes{fstype=~"ext.*|xfs"} / node_filesystem_size_bytes{fstype=~"ext.*|xfs"} * 100) > 85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Ổ cứng server {{ $labels.instance }} ({{ $labels.mountpoint }}) sắp đầy"
              description: "Dung lượng phân vùng {{ $labels.mountpoint }} đã sử dụng trên 85% ."

      - name: kubernetes-alerts
        rules:
          - alert: PodCrashLoopBackOff
            expr: rate(kube_pod_container_status_restarts_total[10m]) * 60 * 10 > 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} trong namespace {{ $labels.namespace }} restart liên tục"
              description: "Pod {{ $labels.pod }} đang bị CrashLoopBackOff hoặc Restart liên tục trong 10 phút."

          - alert: PodNotReady
            expr: sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"}) > 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} không ở trạng thái Running"
              description: "Pod {{ $labels.pod }} trong namespace {{ $labels.namespace }} đang ở trạng thái không ổn định trong hơn 10 phút."

          - alert: DeploymentReplicasMismatch
            expr: kube_deployment_spec_replicas != kube_deployment_status_replicas_available
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Deployment {{ $labels.deployment }} thiếu Replicas"
              description: "Deployment {{ $labels.deployment }} trong namespace {{ $labels.namespace }} hiện không có đủ số replicas yêu cầu trong 10 phút."