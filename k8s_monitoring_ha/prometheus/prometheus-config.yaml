apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/recording.rules.yml
      - /etc/prometheus/alert.rules.yml

    alerting:
      alertmanagers:
        - static_configs: [{targets: ["alertmanager.monitoring.svc.cluster.local:9093"]}]

    scrape_configs:
      # Job 1: Node Exporter - Sửa lỗi lặp bằng cách chuyển sang role: pod (1 pod/node)
      - job_name: 'node-exporter'
        kubernetes_sd_configs: [{role: pod}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: node-exporter
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: ${1}:9100
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: instance
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - replacement: production
            target_label: cluster
        metric_relabel_configs:
          - source_labels: [__name__]
            action: keep
            regex: 'node_cpu_seconds_total|node_memory_MemAvailable_bytes|node_memory_MemTotal_bytes|node_filesystem_avail_bytes|node_filesystem_size_bytes|up'

      # Job 2: Kube State Metrics - Chắt lọc metrics logic
      - job_name: 'kube-state-metrics'
        static_configs: [{targets: ['kube-state-metrics.monitoring.svc.cluster.local:8080']}]
        relabel_configs:
          - replacement: production
            target_label: cluster
        metric_relabel_configs:
          - source_labels: [__name__]
            action: keep
            regex: 'kube_node_status_condition|kube_pod_status_phase|kube_node_status_allocatable|kube_node_status_capacity|kube_pod_container_status_waiting_reason|kube_pod_container_status_restarts_total|kube_pod_container_status_last_terminated_reason|kube_node_info|kube_pod_info|kube_pod_container_resource_limits|up'

      # Job 3: Kubelet - Chỉ lấy Volume stats (PVC)
      - job_name: 'kubelet'
        scheme: https
        tls_config: {insecure_skip_verify: true}
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs: [{role: node}]
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance
          - replacement: production
            target_label: cluster
        metric_relabel_configs:
          - source_labels: [__name__]
            action: keep
            regex: 'kubelet_volume_stats_capacity_bytes|kubelet_volume_stats_used_bytes|up'

      # Job 4: cAdvisor - Chỉ lấy Pod CPU/RAM
      - job_name: 'kubelet-cadvisor'
        scheme: https
        tls_config: {insecure_skip_verify: true}
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs: [{role: node}]
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance
          - replacement: production
            target_label: cluster
        metric_relabel_configs:
          - source_labels: [__name__]
            action: keep
            regex: 'container_cpu_usage_seconds_total|container_memory_working_set_bytes|up'

      # Job 5: API Server
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs: [{role: endpoints}]
        scheme: https
        tls_config: {insecure_skip_verify: true}
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https
          - replacement: production
            target_label: cluster
        metric_relabel_configs:
          - source_labels: [__name__]
            action: keep
            regex: 'up'

  recording.rules.yml: |
    groups:
      - name: sre-recording
        rules:
          # Ép lọc job để chống lặp số liệu từ Prometheus khác trong cụm
          - record: node:cpu_usage:rate5m
            expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{job="node-exporter", mode="idle"}[5m])) * 100)
          
          - record: node:memory_usage:percent
            expr: ((node_memory_MemTotal_bytes{job="node-exporter"} - node_memory_MemAvailable_bytes{job="node-exporter"}) / node_memory_MemTotal_bytes{job="node-exporter"}) * 100
          
          - record: node:disk_usage:percent
            expr: 100 * (1 - node_filesystem_avail_bytes{job="node-exporter", mountpoint="/"} / node_filesystem_size_bytes{job="node-exporter", mountpoint="/"})

          - record: cluster:pods_capacity:total
            expr: sum(kube_node_status_allocatable{job="kube-state-metrics", resource="pods"})
          
          - record: cluster:pods_usage:total
            expr: sum(kube_pod_status_phase{job="kube-state-metrics", phase="Running"})

          - record: cluster:apiserver:up
            expr: avg(up{job="kubernetes-apiservers"})

  alert.rules.yml: |
    groups:
    - name: sre-alerts
      rules:
      - alert: NodeDiskFull
        expr: avg_over_time(node:disk_usage:percent[5m]) > 90
        for: 10m
        labels: {severity: critical}

      - alert: PodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total{job="kube-state-metrics", container!=""}[15m]) > 5
        for: 10m
        labels: {severity: warning}

      - alert: ContainerOOMKilled
        expr: increase(kube_pod_container_status_last_terminated_reason{job="kube-state-metrics", reason="OOMKilled"}[5m]) > 0
        for: 2m
        labels: {severity: critical}

      - alert: APIServerDown
        expr: avg_over_time(cluster:apiserver:up[5m]) < 0.5
        for: 5m
        labels: {severity: critical}
