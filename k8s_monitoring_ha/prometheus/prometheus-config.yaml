# ConfigMap chứa cấu hình chính cho Prometheus và Alert Rules
apiVersion: v1
kind: ConfigMap
metadata: 
  name: prometheus-config
  namespace: monitoring # Namespace triển khai hệ thống giám sát
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s     # Tần suất lấy dữ liệu từ targets (mặc định 15s)
      evaluation_interval: 15s # Tần suất đánh giá các quy tắc cảnh báo (Alert Rules)

    alerting:
      alertmanagers:
      - static_configs:
        - targets:
          # Địa chỉ Service của Alertmanager để Prometheus gửi cảnh báo khi có lỗi
          - alertmanager.monitoring.svc.cluster.local:9093

    rule_files:
      # Đường dẫn nạp các file quy tắc cảnh báo vào Prometheus
      - /etc/prometheus/alert.rules.yml

    scrape_configs:
      # Job tự giám sát chính Prometheus
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Job giám sát tài nguyên phần cứng các Node (Node Exporter)
      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: endpoints # Sử dụng Service Discovery qua Endpoint Kubernetes
            namespaces:
              names:
                - monitoring

        relabel_configs:
          # Chỉ giữ lại các endpoint thuộc Service có tên 'node-exporter'
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: node-exporter

          # Chỉ lấy port có tên là 'metrics' HOẶC port số 9100 (đề phòng headless service không có tên port)
          - source_labels: [__meta_kubernetes_endpoint_port_name, __meta_kubernetes_pod_container_port_number]
            action: keep
            regex: (metrics;.*|.*;9100)

          # Chuyển nhãn tên Node của Pod thành nhãn 'node' để dễ dàng query
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node

          # Đổi luôn nhãn 'instance' thành 'nodeName' (thay vì IP:Port mặc định) để Dashboard không tạo ra instance mới khi Pod restart đổi IP
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: instance

          # Áp dụng tất cả các nhãn (labels) của Pod vào metric (bỏ tiền tố __meta_kubernetes_pod_label_)
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)

      # Job giám sát trạng thái các đối tượng trong Cluster (Deployment, Pod, StatefulSet...)
      - job_name: 'kube-state-metrics'
        static_configs: 
          - targets:
            - kube-state-metrics.monitoring.svc.cluster.local:8080

      # Job giám sát Cilium (Networking & Security)
      - job_name: cilium
        kubernetes_sd_configs:
          - role: pod # Duyệt trực tiếp qua danh sách Pod

        relabel_configs:
          # Chỉ lấy các Pod có nhãn k8s-app=cilium
          - source_labels: [__meta_kubernetes_pod_label_k8s_app]
            action: keep
            regex: cilium

          # Thay đổi địa chỉ metric thành IP của Pod và port 9962
          - source_labels: [__meta_kubernetes_pod_ip]
            separator: ;
            regex: (.*)
            target_label: __address__
            replacement: ${1}:9962
            action: replace

          # Gán nhãn node để biết Pod cilium này đang chạy trên host nào
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node

          # Cố định luôn nhãn 'instance' bằng tên Node thay vì IP
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: instance

      # Job giám sát tài nguyên container từ cAdvisor (tích hợp sẵn trong kubelet)
      # Thu thập: CPU, RAM, Network I/O, Disk I/O chi tiết cho từng container
      - job_name: 'cadvisor'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          # Chuyển đổi địa chỉ sang endpoint cAdvisor của kubelet
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          
          # Cố định nhãn 'instance' là tên Node thay vì IP mặc định
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance

          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

  # File định nghĩa các quy tắc để Prometheus kích hoạt cảnh báo
  alert.rules.yml: |
    groups:
      - name: node-hardware-alerts
        rules:
          - alert: NodeDown
            expr: up{job="node-exporter"} == 0
            for: 3m
            labels:
              severity: critical
              tier: infrastructure
            annotations:
              summary: "[CRITICAL] Mất kết nối Node"
              description: "Mất tín hiệu kết nối với Node Exporter trên máy chủ {{ $labels.instance }} quá 3 phút. Server có thể đã sập hoặc dịch vụ mạng gặp sự cố."

          - alert: NodeHighCpuLoad
            expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
            for: 5m
            labels:
              severity: warning
              tier: infrastructure
            annotations:
              summary: "[WARNING] CPU Server quá tải"
              description: "Máy chủ {{ $labels.instance }} đang tiêu thụ CPU ở mức {{ printf \"%.1f\" $value }}% liên tục trong 5 phút. Hãy kiểm tra các tiến trình (top/htop)."

          - alert: NodeMemoryNearOOM
            expr: 100 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100) > 90
            for: 5m
            labels:
              severity: warning
              tier: infrastructure
            annotations:
              summary: "[WARNING] RAM Server nguy cơ OOM"
              description: "Máy chủ {{ $labels.instance }} đang chiếm dụng RAM ở mức {{ printf \"%.1f\" $value }}% liên tục trong 5 phút."

          - alert: NodeDiskSpaceFillingUp
            expr: (node_filesystem_avail_bytes{fstype=~"ext.*|xfs"} / node_filesystem_size_bytes{fstype=~"ext.*|xfs"} * 100) < 10
            for: 5m
            labels:
              severity: critical
              tier: infrastructure
            annotations:
              summary: "[CRITICAL] Ổ đĩa sắp đầy"
              description: "Mountpoint {{ $labels.mountpoint }} trên máy chủ {{ $labels.instance }} chỉ còn {{ printf \"%.1f\" $value }}% dung lượng trống (<10%). Cần dọn rác ngay lập tức."

          - alert: NodeDiskSpacePredictFill
            expr: predict_linear(node_filesystem_avail_bytes{fstype=~"ext.*|xfs"}[1h], 24 * 3600) < 0
            for: 15m
            labels:
              severity: warning
              tier: infrastructure
            annotations:
              summary: "[WARNING] Cảnh báo sớm: Ổ đĩa đầy sau 24h"
              description: "Dựa trên tốc độ ghi hiện tại, mountpoint {{ $labels.mountpoint }} trên máy chủ {{ $labels.instance }} sẽ đầy trong vòng 24 giờ tới."

      - name: kubernetes-cluster-alerts
        rules:
          - alert: KubePodCrashLooping
            expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
            for: 5m
            labels:
              severity: warning
              tier: kubernetes
            annotations:
              summary: "[WARNING] Pod restart liên tục (CrashLoop)"
              description: "Pod `{{ $labels.pod }}` (Namespace: `{{ $labels.namespace }}`) đã restart hơn 3 lần trong 15 phút qua. Dùng lệnh `kubectl logs {{ $labels.pod }} -n {{ $labels.namespace }}` để xem nguyên nhân."

          - alert: KubePodNotReady
            expr: kube_pod_status_ready{condition="true"} == 0
            for: 10m
            labels:
              severity: warning
              tier: kubernetes
            annotations:
              summary: "[WARNING] Pod không Ready kéo dài"
              description: "Pod `{{ $labels.pod }}` (Namespace: `{{ $labels.namespace }}`) đang ở trạng thái không lọt readiness probe hơn 10 phút."

          - alert: OOMKilled
            expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
            for: 1m
            labels:
              severity: critical
              tier: kubernetes
            annotations:
              summary: "[CRITICAL] Pod bị kill do hết RAM"
              description: "Container `{{ $labels.container }}` trong Pod `{{ $labels.pod }}` ở Namespace `{{ $labels.namespace }}` vừa bị tiêu diệt do Out-Of-Memory (OOMKilled). Cần cấp thêm RAM limit."

          - alert: KubeDeploymentReplicasMismatch
            expr: kube_deployment_spec_replicas != kube_deployment_status_replicas_available
            for: 15m
            labels:
              severity: warning
              tier: kubernetes
            annotations:
              summary: "[WARNING] Hệ thống không đủ Replicas"
              description: "Deployment `{{ $labels.deployment }}` (Namespace: `{{ $labels.namespace }}`) đang chạy thiếu bản sao mong muốn quá 15 phút. Khả năng chịu tải web có thể bị giảm."

          - alert: KubePersistentVolumeError
            expr: kube_persistentvolume_status_phase{phase=~"Failed|Pending"} > 0
            for: 5m
            labels:
              severity: critical
              tier: kubernetes
            annotations:
              summary: "[CRITICAL] Persistent Volume lỗi"
              description: "PV `{{ $labels.persistentvolume }}` đang ở trạng thái Pending hoặc Failed, chặn các stateful workloads hoạt động."

      - name: monitoring-system-alerts
        rules:
          - alert: PrometheusTargetMissing
            expr: up == 0
            for: 5m
            labels:
              severity: critical
              tier: monitoring
            annotations:
              summary: "[CRITICAL] Điểm giám sát bị mất"
              description: "Thành phần {{ $labels.job }} (Instance: {{ $labels.instance }}) đã ngừng hoạt động và không thể cung cấp metrics. Điều này gây hổng dữ liệu giám sát hệ thống."