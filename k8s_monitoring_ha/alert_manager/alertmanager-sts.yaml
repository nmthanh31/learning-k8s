# StatefulSet được sử dụng để Alertmanager có thể hoạt động theo cụm (Cluster Mode) với định danh cố định.
# Điều này cực kỳ quan trọng cho việc đồng bộ trạng thái "Silence" giữa các bản sao.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 3          # Chạy 3 bản sao để đảm bảo tính sẵn sàng cao (High Availability)
  serviceName: "alertmanager-headless" # Liên kết DNS để các Pod tìm thấy nhau (Service Discovery nội bộ)
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      # Thiết lập quyền hạn file để tránh lỗi 'permission denied' khi ghi vào ổ đĩa /alertmanager
      securityContext:
        fsGroup: 65534     # Gán quyền volume cho group nobody (mặc định của Alertmanager)
        runAsUser: 65534   # Chạy container dưới user nobody
        runAsGroup: 65534
        runAsNonRoot: true # Bảo mật: Không cho phép chạy dưới quyền ROOT
 
      # Tránh tình trạng các Pod Alertmanager "đè" lên nhau trên cùng 1 Node vật lý
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - alertmanager
              topologyKey: "kubernetes.io/hostname"
 
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          # Các tham số khởi động điều phối cơ chế hoạt động theo cụm (Gossip Protocol)
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml" # Chỉ định cấu hình
            - "--storage.path=/alertmanager"                    # Nơi lưu trữ trạng thái alerts/silences
            - "--cluster.listen-address=0.0.0.0:9094"            # Cổng để các Pod "nói chuyện" với nhau
            # Khai báo địa chỉ của các "đồng nghiệp" (Peers) để tạo thành mạng lưới ngang hàng (Clustering)
            - "--cluster.peer=alertmanager-0.alertmanager-headless.monitoring.svc.cluster.local:9094"
            - "--cluster.peer=alertmanager-1.alertmanager-headless.monitoring.svc.cluster.local:9094"
            - "--cluster.peer=alertmanager-2.alertmanager-headless.monitoring.svc.cluster.local:9094"
          ports:
            - containerPort: 9093 # Cổng API/Giao diện người dùng
            - containerPort: 9094 # Cổng giao tiếp nội bộ giữa các bản sao (Clustering)
 
          # Kiểm tra Pod đã khởi động xong chưa
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 10
            periodSeconds: 10
 
          # Kiểm tra Pod có bị treo hay không
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            initialDelaySeconds: 15
            periodSeconds: 15
 
          # Giới hạn tài nguyên để Cluster chạy ổn định
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
 
          # Gắn các ổ đĩa và bí mật vào container
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: alertmanager-data
              mountPath: /alertmanager
            - name: alertmanager-secret
              mountPath: /etc/alertmanager/secrets
              readOnly: true # Bảo mật: Chỉ cho phép đọc Secret
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: alertmanager-secret
          secret:
            secretName: alertmanager-secret # Lấy từ Secret chứa Token Telegram
 
  # Cơ chế tự động xin cấp ổ đĩa cứng từ Cluster (Persistent Storage)
  volumeClaimTemplates:
    - metadata:
        name: alertmanager-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "monitoring-storage"
        resources:
          requests:
            storage: 1Gi # 1GB cho mỗi bản sao là đủ để lưu trữ Silences và Alerts hiện tại
