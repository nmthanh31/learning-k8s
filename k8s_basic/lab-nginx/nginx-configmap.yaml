apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-configmap
  namespace: lab
data:
  index.html: |
    <!DOCTYPE html>

    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Nginx Test Page</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            animation: fadeIn 1s ease-in-out;
        }

        h1 {
            margin-bottom: 10px;
            font-weight: 700;
        }

        p {
            font-weight: 300;
            line-height: 1.6;
        }

        .badge {
            display: inline-block;
            margin-top: 15px;
            padding: 6px 12px;
            border-radius: 20px;
            background: #00c6ff;
            color: #000;
            font-size: 12px;
            font-weight: 500;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            opacity: 0.7;
        }

        a {
            color: #00eaff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px);}
            to { opacity: 1; transform: translateY(0);}
        }
    </style>

    </head>

    <body>
        <div class="card">
            <h1>🚀 Pod: <span style="color: #00eaff;">__HOSTNAME__</span></h1>


        <p>
            Your Nginx container is up and serving traffic successfully.
            This page is customized for testing UI, CSS, and deployment.
        </p>

        <div class="badge">Kubernetes Pod OK</div>

        <p style="margin-top:20px;">
            Try modifying this file and redeploy to verify your CI/CD pipeline.
        </p>

        <div class="footer">
            Powered by Nginx | DevOps Test Page
        </div>
    </div>


    </body>
    </html>
