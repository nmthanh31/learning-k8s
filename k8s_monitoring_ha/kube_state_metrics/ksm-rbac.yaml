# 1. ServiceAccount: Danh tính cho Kube-State-Metrics (KSM)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: monitoring
---
# 2. ClusterRole: Tổng hợp các quyền TRUY VẤN (Read-only) trên toàn Cluster.
# KSM không thay đổi bất kỳ tài nguyên nào, nó chỉ đứng ngoài đếm và quan sát trạng thái.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:
# Nhóm "" (Core API): Quan tâm tới số lượng Pod, tài nguyên Node, và lưu trữ (PV/PVC)
- apiGroups: [""]
  resources:
    - pods                   # Đếm số Pod đang Running/Pending/Failed
    - nodes                  # Kiểm tra Node có bị NotReady không
    - namespaces             # Thống kê theo Namespace
    - services               # Theo dõi các Service đang tồn tại
    - endpoints              # Kiểm tra tính sẵn sàng của backend
    - configmaps             # (Ít dùng cho metrics nhưng cần để metadata)
    - secrets                # (Ít dùng cho metrics nhưng cần để metadata)
    - persistentvolumes      # Theo dõi dung lượng ổ đĩa vật lý
    - persistentvolumeclaims # Theo dõi dung lượng ổ đĩa logic ứng dụng đang dùng
    - resourcequotas         # Kiểm tra Namespace có bị hết hạn mức (Quota) không
    - limitranges            # Kiểm tra các quy tắc giới hạn tài nguyên
  verbs: ["list","watch"]

# Nhóm "apps": Deployment, StatefulSet...
- apiGroups: ["apps"]
  resources:
    - deployments            # Kiểm tra Deployment có đủ Replicas không
    - replicasets            # Theo dõi các bản sao của Deployment
    - statefulsets           # Kiểm tra số lượng Pod trong StatefulSet
    - daemonsets             # Theo dõi các ứng dụng chạy trên mọi Node
  verbs: ["list","watch"]

# Nhóm "batch": Job, CronJob
- apiGroups: ["batch"]
  resources:
    - jobs                   # Kiểm tra Job có chạy xong (Success) không
    - cronjobs               # Theo dõi các lịch trình chạy định kỳ
  verbs: ["list","watch"]

# Nhóm "networking": Ingress
- apiGroups: ["networking.k8s.io"]
  resources:
    - ingresses              # Theo dõi các cổng vào hệ thống
  verbs: ["list","watch"]

# Nhóm "autoscaling": HPA
- apiGroups: ["autoscaling"]
  resources:
    - horizontalpodautoscalers # Theo dõi trạng thái tự động giãn nở (Scale)
  verbs: ["list","watch"]
---
# 3. ClusterRoleBinding: Trao quyền quan sát cho ServiceAccount KSM
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
- kind: ServiceAccount
  name: kube-state-metrics
  namespace: monitoring