# ConfigMap chứa cấu hình chính cho Prometheus và Alert Rules
apiVersion: v1
kind: ConfigMap
metadata: 
  name: prometheus-config
  namespace: monitoring # Namespace triển khai hệ thống giám sát
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s     # Tần suất lấy dữ liệu từ targets (mặc định 15s)
      evaluation_interval: 15s # Tần suất đánh giá các quy tắc cảnh báo (Alert Rules)

    alerting:
      alertmanagers:
      - static_configs:
        - targets:
          # Địa chỉ Service của Alertmanager để Prometheus gửi cảnh báo khi có lỗi
          - alertmanager.monitoring.svc.cluster.local:9093

    rule_files:
      # Đường dẫn nạp các file quy tắc cảnh báo vào Prometheus
      - /etc/prometheus/alert.rules.yml

    scrape_configs:
      # Job tự giám sát chính Prometheus
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Job giám sát tài nguyên phần cứng các Node (Node Exporter)
      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: endpoints # Sử dụng Service Discovery qua Endpoint Kubernetes
            namespaces:
              names:
                - monitoring

        relabel_configs:
          # Chỉ giữ lại các endpoint thuộc Service có tên 'node-exporter'
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: node-exporter

          # Chỉ lấy port có tên là 'metrics' HOẶC port số 9100 (đề phòng headless service không có tên port)
          - source_labels: [__meta_kubernetes_endpoint_port_name, __meta_kubernetes_pod_container_port_number]
            action: keep
            regex: (metrics;.*|.*;9100)

          # Chuyển nhãn tên Node của Pod thành nhãn 'node' để dễ dàng query
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node

          # Áp dụng tất cả các nhãn (labels) của Pod vào metric (bỏ tiền tố __meta_kubernetes_pod_label_)
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)

      # Job giám sát trạng thái các đối tượng trong Cluster (Deployment, Pod, StatefulSet...)
      - job_name: 'kube-state-metrics'
        static_configs: 
          - targets:
            - kube-state-metrics.monitoring.svc.cluster.local:8080

      # Job giám sát Cilium (Networking & Security)
      - job_name: cilium
        kubernetes_sd_configs:
          - role: pod # Duyệt trực tiếp qua danh sách Pod

        relabel_configs:
          # Chỉ lấy các Pod có nhãn k8s-app=cilium
          - source_labels: [__meta_kubernetes_pod_label_k8s_app]
            action: keep
            regex: cilium

          # Thay đổi địa chỉ metric thành IP của Pod và port 9962
          - source_labels: [__meta_kubernetes_pod_ip]
            separator: ;
            regex: (.*)
            target_label: __address__
            replacement: ${1}:9962
            action: replace

          # Gán nhãn node để biết Pod cilium này đang chạy trên host nào
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node

  # File định nghĩa các quy tắc để Prometheus kích hoạt cảnh báo
  alert.rules.yml: |
    groups:
      - name: node-alertsv
        rules:
          - alert: InstanceDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "[CRITICAL] Mất kết nối tới điểm giám sát"
              description: |-
                **DỊCH VỤ HOẶC MÁY CHỦ SẬP (DOWN)**
                • **Target (Instance):** `{{ $labels.instance }}`
                • **Nhóm giám sát (Job):** `{{ $labels.job }}`
                • **Chi tiết:** Mất tín hiệu với dịch vụ này trong hơn 1 phút qua. Đề nghị kiểm tra hệ thống ngay!

          - alert: HighCpuLoad
            expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "[WARNING] CPU bị quá tải trên Server"
              description: |-
                **TÀI NGUYÊN CPU ĐANG DÙNG QUÁ CAO**
                • **Máy chủ (Instance):** `{{ $labels.instance }}`
                • **Mức tiêu thụ hiện tại:** `{{ printf "%.1f" $value }}%`
                • **Chi tiết:** Mức sử dụng CPU trung bình đã vượt ngưỡng 85% trong suốt 5 phút vừa qua. Vui lòng rà soát lại các tiến trình ngốn CPU.

          - alert: HighMemoryUsage
            expr: 100 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100) > 90
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "[WARNING] Dung lượng RAM cực thấp"
              description: |-
                **TÀI NGUYÊN RAM GẦN CẠN KIỆT**
                • **Máy chủ (Instance):** `{{ $labels.instance }}`
                • **Mức chiếm dụng hiện tại:** `{{ printf "%.1f" $value }}%`
                • **Chi tiết:** Server này đang quá tải RAM, luôn ở mức >90% suốt 5 phút qua. Cảnh báo nguy cơ dịch vụ tự động bị hệ thống kill (Out-Of-Memory) nếu không giải phóng kịp.

          - alert: HighDiskUsage
            expr: 100 - (node_filesystem_avail_bytes{fstype=~"ext.*|xfs"} / node_filesystem_size_bytes{fstype=~"ext.*|xfs"} * 100) > 85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "[WARNING] Ổ cứng sắp đầy"
              description: |-
                **THIẾU KHÔNG GIAN LƯU TRỮ TRÊN Ổ ĐĨA**
                • **Máy chủ:** `{{ $labels.instance }}`
                • **Phân vùng (Mountpoint):** `{{ $labels.mountpoint }}`
                • **Mức chiếm dụng hiện tại:** `{{ printf "%.1f" $value }}%`
                • **Chi tiết:** Phân vùng ổ đĩa này đang dùng gần hết, hãy chạy lệnh xóa các file thừa thãi, logs dọn rác hệ thống hoặc nâng cấp kích thước ổ!

      - name: kubernetes-alerts
        rules:
          - alert: PodCrashLoopBackOff
            expr: rate(kube_pod_container_status_restarts_total[10m]) * 60 * 10 > 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "[WARNING] Pod restart liên tục"
              description: |-
                **POD HỎNG VÀ KHỞI ĐỘNG LẶP LẠI (CrashLoopBackOff)**
                • **Tên Pod:** `{{ $labels.pod }}`
                • **Namespace:** `{{ $labels.namespace }}`
                • **Chi tiết:** Container thuộc Pod bắt lỗi và tự khởi động lại liên tục trong 10 phút. Xem logs lỗi bằng cú pháp: `kubectl logs {{ $labels.pod }} -n {{ $labels.namespace }}`

          - alert: PodNotReady
            expr: sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"}) > 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "[WARNING] Pod chưa sẵn sàng để phục vụ"
              description: |-
                **POD KẸT TRẠNG THÁI (Not Ready)**
                • **Tên Pod:** `{{ $labels.pod }}`
                • **Namespace:** `{{ $labels.namespace }}`
                • **Chi tiết:** Pod đã ngưng trệ trên các trạng thái Pending/Unknown/Failed trên 10 phút. Kiểm tra xem node bị thiếu tài nguyên, lỗi kéo Images hay config lỗi gì khác.

          - alert: DeploymentReplicasMismatch
            expr: kube_deployment_spec_replicas != kube_deployment_status_replicas_available
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "[WARNING] Dịch vụ không đủ số POD mong muốn"
              description: |-
                **LỆCH SỐ LƯỢNG BẢN SAO CHO DEPLOYMENT**
                • **Deployment:** `{{ $labels.deployment }}`
                • **Namespace:** `{{ $labels.namespace }}`
                • **Chi tiết:** Số lượng Pod sống phản hồi được trên hệ thống không bằng với cấu hình Replicas mong muốn. Khả năng chịu tải web hoặc chức năng hệ thống có thể bị yếu đi. Trục trặc này kéo liên tục 10 phút quá chưa khắc phục!