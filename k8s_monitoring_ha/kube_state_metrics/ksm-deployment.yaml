# Kube-State-Metrics (KSM): Chuyên thu thập các chỉ số "Logic" của Cluster.
# Ví dụ: Có bao nhiêu Deployment đang chạy, Pod nào đang quá hạn Replicas, Pod nào bị Restart...
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  replicas: 1 # KSM không cần dữ liệu bền vững (Stateless) nên chỉ cần chạy Deployment 1 bản sao.
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      # Sử dụng ServiceAccount có quyền "Read-only" trên toàn Cluster để lấy thông tin trạng thái đối tượng.
      serviceAccountName: kube-state-metrics
      containers:
      - name: kube-state-metrics
        image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.12.0
        ports:
        - name: http-metrics
          containerPort: 8080 # Cổng cung cấp metrics cho Prometheus
        - name: telemetry
          containerPort: 8181 # Cổng sức khỏe nội bộ của chính KSM
        
        # Kiểm tra KSM đã sẵn sàng xuất metrics chưa
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        
        # Kiểm tra KSM có bị treo không
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15

        # Tài nguyên tiêu thụ cực thấp nhưng hiệu quả cực cao
        resources:
          requests:
            cpu: "10m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
