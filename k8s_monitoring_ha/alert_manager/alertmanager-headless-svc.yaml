# Service Headless (ClusterIP: None)
# Mục đích: Không dùng Virtual IP. Trả về danh sách IP thực tế của tất cả Pod có nhãn 'app: alertmanager'.
# Cần thiết để các Pod Alertmanager phát hiện (Discover) lẫn nhau và tạo thành cụm HA.
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-headless
  namespace: monitoring
  labels:
    app: alertmanager
spec:
  # Chế độ Headless: Quan trọng để Gossip Cluster hoạt động.
  clusterIP: None 
  selector:
    app: alertmanager # Lọc các Pod cùng nhóm để tạo Cluster
  ports:
    - name: mesh        # Port chuyên dụng cho giao thức Gossip (Trao đổi dữ liệu trạng thái giữa các Node)
      port: 9094
      targetPort: 9094
      protocol: TCP
