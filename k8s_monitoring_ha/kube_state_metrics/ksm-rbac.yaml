# Tạo ServiceAccount cho kube-state-metrics
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: monitoring
---
# Định nghĩa các quyền đọc thông tin tài nguyên cluster mà kube-state-metrics cần 
# để chuyển đổi chúng thành metrics (ví dụ: số lượng pod đang chạy, trạng thái node...)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:
# Quyền liệt kê và theo dõi các tài nguyên cốt lõi
- apiGroups: [""]
  resources:
    - pods
    - nodes
    - namespaces
    - services
    - endpoints
    - configmaps
    - secrets
    - persistentvolumes
    - persistentvolumeclaims
    - resourcequotas
    - limitranges
  verbs: ["list","watch"]
# Quyền liệt kê và theo dõi các tài nguyên apps (Deployment, StatefulSet, DaemonSet, ReplicaSet)
- apiGroups: ["apps"]
  resources:
    - deployments
    - replicasets
    - statefulsets
    - daemonsets
  verbs: ["list","watch"]
# Quyền liệt kê và theo dõi batch resources (Job, CronJob)
- apiGroups: ["batch"]
  resources:
    - jobs
    - cronjobs
  verbs: ["list","watch"]
# Quyền liệt kê và theo dõi Ingress
- apiGroups: ["networking.k8s.io"]
  resources:
    - ingresses
  verbs: ["list","watch"]
# Quyền liệt kê và theo dõi HPA
- apiGroups: ["autoscaling"]
  resources:
    - horizontalpodautoscalers
  verbs: ["list","watch"]
---
# Liên kết ServiceAccount với ClusterRole tương ứng
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
- kind: ServiceAccount
  name: kube-state-metrics
  namespace: monitoring